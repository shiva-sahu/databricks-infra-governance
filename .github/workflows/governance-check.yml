# .github/workflows/governance-check.yml
# ─────────────────────────────────────────────────────────────────────────────
# Governance Gate — runs on every pull request
#
# This workflow is the enforcement layer.
# A failing governance test BLOCKS the PR merge.
# There are no overrides. There are no exceptions.
# Fix the code. Then merge.
# ─────────────────────────────────────────────────────────────────────────────

name: Governance Check

on:
  pull_request:
    branches: [main, dev, staging]
    paths:
      - "terraform/**"
      - "tests/**"
      - ".github/workflows/**"

permissions:
  contents: read
  pull-requests: write  # For posting test results as PR comments

jobs:
  # ── Static Governance Tests ─────────────────────────────────────────────────
  governance-tests:
    name: Governance & Module Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install pytest pytest-md-report pyyaml python-hcl2 jsonschema databricks-sdk

      - name: Run governance tests
        id: governance
        run: |
          pytest tests/governance/ tests/unit/ \
            -v \
            --tb=short \
            --md-report \
            --md-report-output=governance-report.md \
            --junit-xml=governance-results.xml \
            -p no:warnings
        continue-on-error: true  # We handle pass/fail ourselves below

      - name: Post results to PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            let report = '';
            try {
              report = fs.readFileSync('governance-report.md', 'utf8');
            } catch(e) {
              report = 'Could not read governance report.';
            }

            const outcome = '${{ steps.governance.outcome }}';
            const header = outcome === 'success'
              ? '## ✅ Governance Check Passed\nAll naming, permission, and tagging rules are satisfied.'
              : '## 🚨 Governance Check FAILED\nThis PR **cannot be merged** until all violations are resolved.\n\nSee the violations below and fix your Terraform code.';

            const body = `${header}\n\n<details><summary>Full Test Report</summary>\n\n${report}\n\n</details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: governance-results
          path: |
            governance-report.md
            governance-results.xml

      - name: Fail if governance tests failed
        if: steps.governance.outcome == 'failure'
        run: |
          echo "::error::Governance tests failed. Fix all violations before merging."
          echo "::error::Run 'pytest tests/governance/ tests/unit/ -v' locally to see full output."
          exit 1

  # ── Terraform Validation ─────────────────────────────────────────────────────
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        environment: [dev, prod]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"

      - name: Terraform Format Check
        run: |
          terraform fmt -check -recursive terraform/
          if [ $? -ne 0 ]; then
            echo "::error::Terraform files are not formatted. Run 'terraform fmt -recursive terraform/' to fix."
            exit 1
          fi

      - name: Terraform Init (modules only — no backend)
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform validate

  # ── Terraform Plan ────────────────────────────────────────────────────────────
  terraform-plan:
    name: Terraform Plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [governance-tests, terraform-validate]
    strategy:
      matrix:
        environment: [dev]  # Only plan dev on PRs; prod planned on merge to main

    env:
      ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}
      DATABRICKS_HOST:     ${{ secrets.DATABRICKS_HOST_DEV }}
      DATABRICKS_TOKEN:    ${{ secrets.DATABRICKS_TOKEN_DEV }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"

      - name: Terraform Init
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform init -backend=false

      - name: Terraform Plan
        id: plan
        working-directory: terraform/environments/${{ matrix.environment }}
        run: |
          terraform plan \
            -var="databricks_host=${{ secrets.DATABRICKS_HOST_DEV }}" \
            -var="databricks_token=${{ secrets.DATABRICKS_TOKEN_DEV }}" \
            -var="metastore_id=${{ secrets.METASTORE_ID }}" \
            -var="workspace_numeric_id=${{ secrets.WORKSPACE_NUMERIC_ID_DEV }}" \
            -var="access_connector_id=${{ secrets.ACCESS_CONNECTOR_ID_DEV }}" \
            -var="adls_storage_account=${{ secrets.ADLS_STORAGE_ACCOUNT }}" \
            -var="log_analytics_workspace_id=${{ secrets.LOG_ANALYTICS_WORKSPACE_ID }}" \
            -var="key_vault_resource_id=${{ secrets.KEY_VAULT_RESOURCE_ID }}" \
            -var="key_vault_dns_name=${{ secrets.KEY_VAULT_DNS_NAME }}" \
            -out=tfplan \
            -no-color 2>&1 | tee plan-output.txt

      - name: Post plan to PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/environments/${{ matrix.environment }}/plan-output.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.substring(0, 60000) + '\n... (truncated)' : plan;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📋 Terraform Plan — \`${{ matrix.environment }}\`\n\`\`\`hcl\n${truncated}\n\`\`\``
            });

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}
          path: terraform/environments/${{ matrix.environment }}/tfplan
